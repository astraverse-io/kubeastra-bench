apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: prod
data:
  QUEUE: default
  LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: prod
spec:
  replicas: 4
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/acme/worker:2.1.0
          resources:
            limits:
              memory: 384Mi
